schema_version: business_variety_cases_v1
# Varied owner wording. The model reads each message; only the facts it states are asserted.
cases:
  - id: slang_le_meti
    language: es-419
    draft_alias: draft_a
    setup: {"space": "pilot_a", "owner": "owner_a", "accountant": "accountant_a", "accountant_grant": "grant_a", "grant_issuer": "owner_a"}
    steps:
      - actor: owner_a
        channel: whatsapp
        source: message_1
        message: "le metí 850 a los materiales"
        expect: {"kind": "expense", "amount": "850"}
