          money: {record_count: 0, bank_balance_delta: '0', personal_balance_delta: '0', bank_versions_unchanged: true, personal_versions_unchanged: true, bank_record_count: 0, personal_record_count: 0}
          actions:
            - {name: business_propose_activity, outcome: applied, actor: owner_a, grant: owner_grant_a, issuer: owner_a}
            - {name: business_ask, outcome: applied, actor: owner_a, grant: owner_grant_a, issuer: owner_a}
          visible_sources: [message_g1]

  - id: en_replay_stale_and_current_grant
    purpose: Same delivery replays, stale version fails, and current grant governs approval
