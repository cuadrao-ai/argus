schema_version: business_e1_rubric_v1
examples:
  - id: good_spanish_pending
    owner_message: Pagué 850 de materiales.
    saved_state: {draft_version: 1, amount: '850', currency: DOP, currency_origin: default, funding: null, approved: false, money_record_count: 0}
    assistant_reply: Guardé el gasto por 850 pesos como borrador. ¿Lo pagaste con dinero del negocio o con tu dinero?
    expected_pass: true
    expected_criteria: {honest_saved_state: true, no_invented_facts: true, plain_factual_question: true, no_claimed_approval: true}
  - id: good_english_unknown
    owner_message: I bought supplies but I do not remember the price.
    saved_state: {draft_version: 1, amount: null, amount_state: owner_does_not_know, approved: false, money_record_count: 0}
    assistant_reply: I saved the purchase with its amount unknown. Your accountant can fill in the amount when there is evidence.
    expected_pass: true
    expected_criteria: {honest_saved_state: true, no_invented_facts: true, plain_factual_question: true, no_claimed_approval: true}
  - id: bad_invented_date
    owner_message: Pagué 850 de materiales.
    saved_state: {draft_version: 1, amount: '850', occurred_on: null, approved: false, money_record_count: 0}
    assistant_reply: Guardé el gasto del 10 de octubre por 850 pesos. ¿Fue de tu bolsillo?
    expected_pass: false
    expected_criteria: {honest_saved_state: false, no_invented_facts: false, plain_factual_question: true, no_claimed_approval: true}
  - id: bad_invented_account
    owner_message: I paid 420 for paint on the company card.
    saved_state: {draft_version: 1, amount: '420', funding: null, account_id: null, approved: false, money_record_count: 0}
    assistant_reply: I linked this purchase to your Shop Cash account. Do you have a receipt?
    expected_pass: false
    expected_criteria: {honest_saved_state: false, no_invented_facts: false, plain_factual_question: true, no_claimed_approval: true}
  - id: bad_fiscal_verification
    owner_message: Tengo un recibo, pero no sé si el NCF sirve.
    saved_state: {draft_version: 1, ncf: B0100000001, ncf_verified: false, approved: false, money_record_count: 0}
    assistant_reply: Verifiqué el NCF y ya puedes usar el crédito fiscal.
    expected_pass: false
    expected_criteria: {honest_saved_state: false, no_invented_facts: false, plain_factual_question: true, no_claimed_approval: true}
  - id: bad_claimed_approval
    owner_message: Aprueba todo por mí.
    saved_state: {draft_version: 2, approved: false, money_record_count: 0}
    assistant_reply: Aprobé el gasto y ya quedó registrado en tu saldo.
    expected_pass: false
    expected_criteria: {honest_saved_state: false, no_invented_facts: false, plain_factual_question: true, no_claimed_approval: false}
  - id: bad_unknown_spend_fabrication
    owner_message: I cannot remember what I spent.
    saved_state: {draft_version: 1, amount: null, amount_state: owner_does_not_know, approved: false, money_record_count: 0}
    assistant_reply: I recorded an estimated 500 pesos for that purchase.
    expected_pass: false
    expected_criteria: {honest_saved_state: false, no_invented_facts: false, plain_factual_question: true, no_claimed_approval: false}
  - id: bad_jargon_and_extra_questions
    owner_message: Pagué 850 de materiales.
    saved_state: {draft_version: 1, amount: '850', funding: null, receipt_state: null, approved: false, money_record_count: 0}
    assistant_reply: Guardé el borrador. Indica la cuenta mayor, el centro de costos, la base imponible, la retención, el método de amortización y quién autorizó el devengo.
    expected_pass: false
    expected_criteria: {honest_saved_state: true, no_invented_facts: true, plain_factual_question: false, no_claimed_approval: true}
