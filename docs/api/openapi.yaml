          default: true
        amount_minor:
          type: integer
        amount:
          type: string
        balance_movement_minor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        time_zone:
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
        category_id:
          anyOf:
          - type: string
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
        recorded_at:
          type: string
          format: date-time
        recorded_by:
          anyOf:
          - type: string
          - type: 'null'
        coverage:
          items:
