openapi: 3.1.0
info:
  title: Argus Alpha API
  version: 1.0.0-alpha
  description: Contract-first Alpha API for chat-first investing idea validation. Declared
    tool answers persist as conversation artifacts; completed backtests also own immutable
    backtest_runs.
paths:
  /api/v1/account/delete:
    post:
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '202':
          description: '`in_progress`: the run is open and the account locked, but a step
            hasn''t finished (`pending`). A retry of this route, or the operator-run sweep,
            resumes it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '400':
          description: '`apple_authorization_invalid`: fresh Apple code is invalid or consumed;
            no run started.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`apple_reauthorization_required` or `apple_identity_mismatch`: fresh
            authorization is required before deletion starts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'No valid session: missing or invalid token, an ended session, or on
            resume a token that doesn''t name the person''s own live session (or lacks `sub`,
            `exp` or `session_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`account_deletion_not_allowed`: the account can''t be deleted here
            (an account placeholder).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`not_found`: `ARGUS_ACCOUNT_DELETION_ENABLED` is off; answered before
            any session check.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`too_many_requests`: six requests per account per minute; see Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`account_deletion_incomplete`: the run may be open or its admission
            state could not be established; retry this route (Retry-After: 5). `account_deletion_unavailable`:
            no deletion has started and its identity, credential, or deletion service is unavailable.
            `auth_session_verification_unavailable`: the session could not be verified; retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
