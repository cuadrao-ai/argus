  /api/v1/ingestion/shortcuts/events:
    post:
      tags:
      - financial-accounts
      - financial-connections
      description: 'Device-token only. Re-sending the same event returns the same receipt.


        A receipt is returned only for a held capture; anything else is an error,

        so a recipe that checks for ``receipt_id`` never mistakes it for saved.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                event_id:
                  anyOf:
                  - type: string
                    maxLength: 100
                    minLength: 1
                  - type: 'null'
                kind:
                  type: string
                  enum:
                  - transaction
                  - message_capture
                source_app:
                  type: string
                  enum:
                  - wallet
                  - messages
                  - notifications
                captured_at:
                  type: string
                  format: date-time
                amount:
                  anyOf:
                  - type: string
                    maxLength: 64
                  - type: 'null'
                currency:
                  anyOf:
                  - type: string
                    pattern: ^[A-Za-z]{3}$
                  - type: 'null'
                merchant:
                  anyOf:
                  - type: string
                    maxLength: 200
                  - type: 'null'
                card:
                  anyOf:
                  - type: string
                    maxLength: 120
                  - type: 'null'
                card_last4:
                  anyOf:
                  - type: string
                    pattern: ^[0-9]{4}$
                  - type: 'null'
                sender:
                  anyOf:
                  - type: string
                    maxLength: 120
                  - type: 'null'
                text:
                  anyOf:
                  - type: string
                    maxLength: 1000
                  - type: 'null'
              additionalProperties: false
              type: object
              required:
              - kind
              - source_app
              - captured_at
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
