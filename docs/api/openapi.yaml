            - inputs_not_editable
            - run_unavailable
            - retest_unavailable
          - type: 'null'
      type: object
      required:
      - kind
      - inputs
      - status
      description: 'The outcome of opening or re-running a decision''s computation.


        ``computed`` carries the kernel''s typed result. ``confirmation_required``

        carries the typed retest action for a backtest, which earns its

        confirmation by cost and never executes here. ``unavailable`` names why

        nothing ran, as a code, never prose.'
    DecisionRerunRequest:
      properties:
        inputs:
          additionalProperties: true
          type: object
        calculation:
          type: integer
          exclusiveMaximum: 4.0
          minimum: 0.0
          default: 0
      additionalProperties: false
      type: object
      description: 'Input overrides merged over one calculation''s stored inputs, by its index

        in the computation; the decision is unchanged.'
