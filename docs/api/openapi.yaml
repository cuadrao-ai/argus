components:
  schemas:
    AIConsentResponse:
      properties:
        linked:
          type: boolean
        available:
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
        last4:
          anyOf:
          - type: string
          - type: 'null'
        scope_version:
          type: integer
        purpose:
          type: string
        active_scope_version:
          anyOf:
          - type: integer
          - type: 'null'
        disclosure:
          type: string
        route:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
        disclosure_token:
          anyOf:
          - type: string
          - type: 'null'
        enabled:
          type: boolean
        consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - linked
      - available
      - reason
      - last4
      - scope_version
      - purpose
      - disclosure
      - route
      - disclosure_token
      - enabled
      - consented_at
      - revoked_at
    AcceptBatchBody:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchItem'
          type: array
          maxItems: 100
          minItems: 1
      additionalProperties: false
      type: object
      required:
      - items
    AcceptBatchResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchOutcome'
          type: array
      type: object
      required:
      - items
    AcceptBody:
      properties:
        version:
          type: integer
          minimum: 1.0
        request:
          $ref: '#/components/schemas/MoneyRequest'
      additionalProperties: false
      type: object
      required:
      - version
      - request
    AcceptBusinessConsent:
      properties:
        version:
          type: string
          pattern: ^[0-9a-f]{16}$
      additionalProperties: false
      type: object
      required:
      - version
    AcceptInvitationBody:
      properties:
        space_id:
          type: string
          format: uuid
      type: object
      required:
      - space_id
    AcceptInvitationRequest:
      properties:
        token:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 8
          - type: 'null'
        code:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 4
          - type: 'null'
        display_name:
          type: string
          maxLength: 60
          minLength: 1
          default: Member
      additionalProperties: false
      type: object
      description: The token from the link or QR, or the typed code. Exactly one.
    AccessApprovalResponse:
      properties:
        approved:
          type: boolean
          const: true
          default: true
      additionalProperties: false
      type: object
    AccessRequestAccepted:
      properties:
        accepted:
          type: boolean
          const: true
      additionalProperties: false
      type: object
      required:
      - accepted
    AccessRequestCreate:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
        language:
          type: string
          enum:
          - en
          - es-419
      additionalProperties: false
      type: object
      required:
      - email
      - language
    AccountCapabilities:
      properties:
        can_create_additional_conversation:
          type: boolean
        can_manage_conversation:
          type: boolean
        can_save_decision:
          type: boolean
        can_manage_account:
          type: boolean
        can_use_omnisearch:
          type: boolean
        can_search_current_workspace:
          type: boolean
        can_use_grounded_discovery:
          type: boolean
        can_submit_feedback:
          type: boolean
      type: object
      required:
      - can_create_additional_conversation
      - can_manage_conversation
      - can_save_decision
      - can_manage_account
      - can_use_omnisearch
      - can_search_current_workspace
      - can_use_grounded_discovery
      - can_submit_feedback
    AccountChoice:
      properties:
        id:
          type: string
          format: uuid
        nickname:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        currency:
          type: string
      additionalProperties: false
      type: object
      required:
      - id
      - nickname
      - type
      - currency
    AccountCoverage:
      properties:
        account_id:
          type: string
          format: uuid
        name:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        bank_account_id:
          type: string
          format: uuid
        currency:
          type: string
        covered_through:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Newest movement date imported for this account. Later dates are unknown,
            not missing.
      type: object
      required:
      - account_id
      - name
      - type
      - bank_account_id
      - currency
      - covered_through
    AccountDeletionEligibilityResponse:
      properties:
        allowed:
          type: boolean
        blockers:
          items:
            oneOf:
            - $ref: '#/components/schemas/BusinessOwnerBlocker'
            - $ref: '#/components/schemas/NotAllowedBlocker'
            discriminator:
              propertyName: kind
              mapping:
                business_owner: '#/components/schemas/BusinessOwnerBlocker'
                not_allowed: '#/components/schemas/NotAllowedBlocker'
          type: array
        notices:
          items:
            $ref: '#/components/schemas/ClosedBusinessNotice'
          type: array
      type: object
      required:
      - allowed
      - blockers
      - notices
    AccountDeletionRequest:
      properties:
        confirm:
          type: boolean
          const: true
        apple_authorization_code:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
            pattern: ^[\x00-\x7f]+$
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - confirm
    AccountDeletionResponse:
      properties:
        status:
          type: string
          enum:
          - done
          - in_progress
        pending:
          items:
            type: string
          type: array
      type: object
      required:
      - status
      - pending
    AccountHit:
