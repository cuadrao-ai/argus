          type: array
      type: object
      required:
      - record_id
      - revision
      - amount_minor
      - amount
      - balance_movement_minor
      - occurred_at
      - time_zone
      - note
      - category_id
      - reason
      - recorded_at
      - recorded_by
      - coverage
    ActorProvenance:
      properties:
