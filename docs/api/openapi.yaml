  /api/v1/me/photo:
    put:
      tags:
      - profile
      description: 'Replace the person''s photo with the raw picture in the body

        (`Content-Type: image/jpeg`, `image/png` or `image/webp`, at most 5 MiB,

        cropped square by the client). It is stored as a 256 px WebP square with

        its metadata dropped. The reply is the `GET /me` document.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: '`account_conversion_required`: a guest has no profile photo.'
        '413':
          description: '`image_too_large`: the picture is over 5 MiB.'
        '415':
          description: '`image_media_type_unsupported`: not a JPEG, PNG or WebP.'
        '422':
          description: '`image_invalid`: not one still picture of at least 64 pixels on each
            side and at most 25 million pixels in all (`context.reason`: `undecodable`, `too_small`,
            `animated`, `too_many_pixels`).'
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - profile
      description: Remove the person's photo; removing an absent photo is a 204 too.
      responses:
        '204':
          description: Successful Response
        '403':
          description: '`account_conversion_required`: a guest has no profile photo.'
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
