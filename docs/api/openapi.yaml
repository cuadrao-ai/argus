        required: true
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      - name: decision_state
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - watching
            - promising
            - rejected
            - revisit_later
            type: string
          - type: 'null'
      - name: include_ledger_groups
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: conversation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
            minItems: 1
            maxItems: 50
          - type: 'null'
      - name: surface
        in: query
        required: false
        schema:
          enum:
          - personal
          - business
          type: string
          default: business
      - name: X-Argus-Client-Capabilities
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSearch'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Search temporarily unavailable because exact bounded recall could not
            be completed, or authentication-session verification is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/webhooks/fiscal-sandbox/emission:
    post:
      tags:
      - financial-accounts
      - business
      parameters:
      - name: X-Cuadrao-Fiscal-Callback
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '200':
          description: Authenticated probe only
        '401':
          description: Static callback authentication failed
        '413':
          description: Body exceeds 32768 bytes
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/webhooks/resend:
    post:
      tags:
      - financial-accounts
      - business-email
      description: 'Signature checked over the raw bytes before parsing. 202 means the event

        is a durable row; the worker fetches the message later.'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: 'email_intake_unavailable: email receiving is off or not configured.'
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/webhooks/whatsapp:
    get:
      tags:
      - financial-accounts
      - whatsapp
      parameters:
      - name: hub.mode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
      - name: hub.verify_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
      - name: hub.challenge
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 'whatsapp_unavailable: receiving is off or the selected Business is
            ineligible.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthSessionVerificationUnavailable'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - financial-accounts
      - whatsapp
      description: 'Signature checked over the raw bytes before any parsing.


        200 means every message in the delivery has a committed record. A failure

        after that answers 503 so Meta redelivers; the redelivery resumes the

        same record instead of starting a second capture.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
