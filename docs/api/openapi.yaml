      description: A decision and one re-run per calculation, in the computation's order.
    DecisionRerun:
      properties:
        kind:
          type: string
        inputs:
          additionalProperties: true
          type: object
        status:
          type: string
          enum:
          - computed
          - confirmation_required
          - unavailable
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
        retest:
          anyOf:
          - $ref: '#/components/schemas/SearchRetestAction'
          - type: 'null'
        reason_code:
          anyOf:
          - type: string
