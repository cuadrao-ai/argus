                    properties:
                      event_id:
                        anyOf:
                        - type: string
                          maxLength: 100
                          minLength: 1
                        - type: 'null'
                      kind:
                        type: string
                        enum:
                        - transaction
                        - message_capture
                      source_app:
                        type: string
                        enum:
                        - wallet
                        - messages
                        - notifications
                      captured_at:
                        type: string
                        format: date-time
                      amount:
                        anyOf:
                        - type: string
                          maxLength: 64
                        - type: 'null'
                      currency:
                        anyOf:
                        - type: string
                          pattern: ^[A-Za-z]{3}$
                        - type: 'null'
                      merchant:
                        anyOf:
                        - type: string
                          maxLength: 200
                        - type: 'null'
                      card:
                        anyOf:
                        - type: string
                          maxLength: 120
                        - type: 'null'
                      card_last4:
                        anyOf:
                        - type: string
                          pattern: ^[0-9]{4}$
                        - type: 'null'
                      sender:
                        anyOf:
                        - type: string
                          maxLength: 120
                        - type: 'null'
                      text:
                        anyOf:
                        - type: string
                          maxLength: 1000
                        - type: 'null'
                    additionalProperties: false
                    type: object
                    required:
