          $ref: '#/components/schemas/FinancialAccountResponse'
      type: object
      required:
      - account
    AccountShare:
      properties:
        account_id:
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/Recipient'
          type: array
      type: object
      required:
      - account_id
      - recipients
    ActivityActor:
      properties:
        display_name:
          type: string
        kind:
          type: string
          enum:
          - owner_via_agent
          - member
          - extractor
