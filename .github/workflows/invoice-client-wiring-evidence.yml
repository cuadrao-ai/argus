name: Connected invoice synthetic viewport evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  invoice-client-wiring-evidence:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/invoice-client-wiring-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_ENABLE_SPANISH: "true"
      NEXT_PUBLIC_BUSINESS_PILOT_ENABLED: "true"
      NEXT_PUBLIC_CUADRAO_BUSINESS_INVOICING_ENABLED: "true"
      NEXT_PUBLIC_CUADRAO_API_URL: http://127.0.0.1:4416/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_DIST_DIR: .next-invoice-client-evidence
      EVIDENCE_WEB_BASE_URL: http://127.0.0.1:4415
      EVIDENCE_FIXTURE_BASE_URL: http://127.0.0.1:4416
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen web and headless browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture exact-head synthetic viewport evidence
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/invoice-client-wiring-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_OUTPUT"
          cd web
          bun node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 4415 --webpack > "$EVIDENCE_OUTPUT/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; wait "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            kill -0 "$web_pid"
            if curl --fail --silent http://127.0.0.1:4415/biz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4415/biz > /dev/null
          cd ..
          bun scripts/qa/invoice_client_wiring_evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-client-wiring-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/invoice-client-wiring-evidence/
          if-no-files-found: error
          retention-days: 14
