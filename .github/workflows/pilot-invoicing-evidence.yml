name: Pilot invoicing synthetic viewport evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  pilot-invoicing-evidence:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/pilot-connected-integration-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_ENABLE_SPANISH: "true"
      NEXT_PUBLIC_BUSINESS_PILOT_ENABLED: "true"
      NEXT_PUBLIC_CUADRAO_API_URL: http://127.0.0.1:4406/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_DIST_DIR: .next-pilot-evidence
      EVIDENCE_WEB_BASE_URL: http://127.0.0.1:4405
      EVIDENCE_FIXTURE_BASE_URL: http://127.0.0.1:4406
      EVIDENCE_FIXTURE_PORT: "4406"
      EVIDENCE_FROZEN_SOURCE_HEAD: d3f93242527220384b6ab54d9f2b2b3b9ad91e82
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen web and headless browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture exact-head synthetic viewport evidence
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/pilot-invoicing-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_OUTPUT"
          cd web
          bun scripts/registros-wiring-fixture.ts > "$EVIDENCE_OUTPUT/fixture.log" 2>&1 &
          fixture_pid=$!
          bun node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 4405 --webpack > "$EVIDENCE_OUTPUT/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$fixture_pid" 2>/dev/null || true; wait "$web_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            kill -0 "$fixture_pid"
            kill -0 "$web_pid"
            if curl --fail --silent http://127.0.0.1:4406/api/v1/business/spaces > /dev/null && curl --fail --silent http://127.0.0.1:4405/biz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4406/api/v1/business/spaces > /dev/null
          curl --fail --silent http://127.0.0.1:4405/biz > /dev/null
          cd ..
          bun scripts/qa/pilot_invoicing_evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-invoicing-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pilot-invoicing-evidence/
          if-no-files-found: error
          retention-days: 14
