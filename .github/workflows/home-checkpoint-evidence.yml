name: Home checkpoint synthetic viewport evidence

on:
  pull_request:
    branches: [codex/private-alpha-next]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  home-synthetic-evidence:
    if: github.head_ref == 'codex/home-checkpoint-integration-20261024' || github.head_ref == 'codex/design-checkpoint-integration-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_ENABLE_SPANISH: "true"
      NEXT_PUBLIC_BUSINESS_PILOT_ENABLED: "true"
      NEXT_PUBLIC_CUADRAO_API_URL: http://127.0.0.1:4418/api/v1
      NEXT_PUBLIC_ARGUS_API_URL: http://127.0.0.1:4418/api/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4418
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen web and pinned Chromium dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual Home with a synthetic loopback API
        working-directory: web
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/home-checkpoint-synthetic-evidence
        run: |
          set -euo pipefail
          bun scripts/home-checkpoint-fixture.ts > "$RUNNER_TEMP/home-checkpoint-fixture.log" 2>&1 &
          fixture_pid=$!
          bun node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 4417 > "$RUNNER_TEMP/home-checkpoint-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$fixture_pid" 2>/dev/null || true; wait "$web_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if ! kill -0 "$fixture_pid" 2>/dev/null || ! kill -0 "$web_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/home-checkpoint-fixture.log" "$RUNNER_TEMP/home-checkpoint-web.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4418/api/v1/business/spaces > /dev/null && curl --fail --silent http://127.0.0.1:4417/biz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4418/api/v1/business/spaces > /dev/null
          curl --fail --silent http://127.0.0.1:4417/biz > /dev/null
          bun scripts/home-checkpoint-evidence.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-checkpoint-synthetic-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/home-checkpoint-synthetic-evidence/
          if-no-files-found: error
          retention-days: 14
