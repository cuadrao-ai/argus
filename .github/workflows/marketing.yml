name: Marketing

"on":
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketing-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Check environment example
        run: bun run check:env
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Browser journeys with local provider fixtures
        run: bun run test:e2e
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-playwright-report
          path: marketing/playwright-report
