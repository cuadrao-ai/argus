name: Business duplicate resolution evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    # Checked against script imports and driven pages by tests/test_ci_evidence_paths.py.
    paths:
      - .github/workflows/business-duplicate-resolution-evidence.yml
      - web/app/biz/page.tsx
      - web/app/design-workspace/*
      - web/app/fonts/*
      - web/app/globals.css
      - web/app/layout.tsx
      - web/argus_display_contract/result_display_policy.json
      - web/argus_display_contract/support_contact.json
      - web/bun.lock
      - web/components/CuadraoLockup.tsx
      - web/components/CuadraoMark.tsx
      - web/components/FullscreenLoading.module.css
      - web/components/FullscreenLoading.tsx
      - web/components/I18nProvider.tsx
      - web/components/ThemeProvider.tsx
      - web/components/business-app/*
      - web/components/business-app/actividad/*
      - web/components/business-app/dossier/*
      - web/components/business-app/foundation/*
      - web/components/business-app/inicio/*
      - web/components/business-app/invoicing/*
      - web/components/business-app/recepcion/*
      - web/components/business-app/recepcion/assets/inbox-empty.png
      - web/components/business-app/transacciones/*
      - web/components/chat/*
      - web/components/feedback/FeedbackAsk.tsx
      - web/components/feedback/FeedbackDialog.tsx
      - web/components/identity/IdentityEditor.tsx
      - web/components/identity/IdentityMark.tsx
      - web/components/keyboard/*
      - web/components/layout/*
      - web/components/money/MoneyInput.tsx
      - web/components/receipt/ReceiptBody.tsx
      - web/components/receipt/ReceiptChart.tsx
      - web/components/receipt/ReceiptFollowupBox.tsx
      - web/components/receipt/ReceiptTurnContent.tsx
      - web/components/settings/*
      - web/components/sidebar/*
      - web/components/sidebar/command-palette/*
      - web/components/status/*
      - web/components/ui/*
      - web/e2e/dossier-read-states.spec.ts
      - web/e2e/support/breakpoint-fixture.ts
      - web/e2e/support/business-receipt-fixture.ts
      - web/e2e/support/month-close-wire.ts
      - web/e2e/support/synthetic-business-fallback.ts
      - web/lib/*
      - web/next.config.ts
      - web/package.json
      - web/playwright.config.ts
      - web/postcss.config.mjs
      - web/proxy.ts
      - web/public/brand/*
      - web/public/icons/apple-touch-icon-180.png
      - web/public/images/invoicing/customer-directory.png
      - web/public/images/invoicing/first-invoice.png
      - web/public/images/invoicing/schedule-calendar.png
      - web/public/images/notifications/quiet-bell.png
      - web/public/locales/en/common.json
      - web/public/locales/es-419/common.json
      - web/public/manifest.json
      - web/scripts/receipt-duplicate-resolution-evidence.ts
      - web/test-fixtures/records-columns-by-family.json
      - web/test-fixtures/records-default-report-answer.json
      - web/tsconfig.json

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_ARGUS_API_URL: http://127.0.0.1:3198/api/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3198
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install web and headless browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Build the synthetic local app
        working-directory: web
        run: bun run build
      - name: Capture and assert synthetic receipt review
        working-directory: web
        run: |
          mkdir -p ../temp/duplicate-resolution-evidence
          bun node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3198 > ../temp/duplicate-resolution-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3198/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3198/ > /dev/null
          bun scripts/receipt-duplicate-resolution-evidence.ts
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3198 bunx playwright test e2e/dossier-read-states.spec.ts --output=../temp/duplicate-resolution-evidence/read-states
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: business-duplicate-resolution-${{ github.event.pull_request.head.sha || github.sha }}
          path: temp/duplicate-resolution-evidence/
          if-no-files-found: error
          retention-days: 14
