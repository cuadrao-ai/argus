name: Local boot smoke

"on":
  workflow_dispatch:
  push:
    branches: ["codex/private-alpha-next"]
  pull_request:
    branches: ["codex/private-alpha-next", "codex/private-alpha-next-jules-intake"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: private-alpha-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/private-alpha-next' && github.ref != 'refs/heads/codex/private-alpha-next-jules-intake' }}

jobs:
  docs-change-gate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify docs-only changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/docs-only-changes.sh

  local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docs-change-gate
    if: (github.event.pull_request.draft == false || github.event_name != 'pull_request') && needs.docs-change-gate.outputs.run_heavy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Run local predeploy smoke
        run: .github/local-smoke.sh --expected-sha "$GITHUB_SHA"
