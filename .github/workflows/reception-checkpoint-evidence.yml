name: Reception checkpoint synthetic viewport evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    types: [opened, reopened, synchronize]
    paths:
      - .agent/designs/cuadrao-business-app/DESIGN.md
      - docs/handoffs/reception-design-checkpoint-20261026.md
      - docs/reports/reception-preview-20261026.md
      - web/__tests__/business-bandeja-list.dom.test.tsx
      - web/__tests__/business-canvas.dom.test.tsx
      - web/__tests__/reception-preview-filters.dom.test.tsx
      - web/__tests__/reception-preview-model.test.ts
      - web/__tests__/reception-preview-organization.test.ts
      - web/__tests__/reception-preview-original.test.tsx
      - web/__tests__/reception-preview-pagination.dom.test.tsx
      - web/components/business-app/BusinessInboxPanel.tsx
      - web/components/business-app/BusinessPanel.tsx
      - web/components/business-app/BusinessSidebarNav.tsx
      - web/components/business-app/BusinessWorkspace.tsx
      - web/components/business-app/ReceiptSourcePreview.tsx
      - web/components/business-app/nav-glyphs.module.css
      - web/components/business-app/nav-glyphs.tsx
      - web/components/business-app/recepcion/ReceptionAddMenu.tsx
      - web/components/business-app/recepcion/ReceptionArrivalRow.tsx
      - web/components/business-app/recepcion/ReceptionBulkBar.tsx
      - web/components/business-app/recepcion/ReceptionControls.tsx
      - web/components/business-app/recepcion/ReceptionDossier.tsx
      - web/components/business-app/recepcion/ReceptionEmptyState.tsx
      - web/components/business-app/recepcion/ReceptionFilters.tsx
      - web/components/business-app/recepcion/ReceptionOriginal.tsx
      - web/components/business-app/recepcion/ReceptionPreview.tsx
      - web/components/business-app/recepcion/ReceptionSkeleton.tsx
      - web/components/business-app/recepcion/ReceptionStatus.tsx
      - web/components/business-app/recepcion/assets/inbox-empty.png
      - web/components/business-app/recepcion/reception-filters.ts
      - web/components/business-app/recepcion/reception-model.ts
      - web/components/business-app/recepcion/reception-organization-preview.ts
      - web/components/business-app/recepcion/reception.module.css
      - web/components/business-app/transacciones/RecordsDatePreview.tsx
      - web/components/business-app/transacciones/RecordsFilterSelection.tsx
      - web/components/business-app/transacciones/RecordsFiltersPreview.tsx
      - web/components/business-app/transacciones/RecordsPagePreview.tsx
      - web/components/business-app/transacciones/RecordsPaginationControls.tsx
      - web/public/locales/en/common.json
      - web/public/locales/es-419/common.json
      - scripts/qa/reception_checkpoint_evidence.mjs
      - .github/workflows/reception-checkpoint-evidence.yml

permissions:
  contents: read

jobs:
  reception-checkpoint-evidence:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/reception-checkpoint-integration-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVIDENCE_WEB_BASE_URL: http://127.0.0.1:4421
      EVIDENCE_FIXTURE_BASE_URL: http://127.0.0.1:4422
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen web and headless browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture exact-head synthetic viewport evidence
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT: ${{ runner.temp }}/reception-checkpoint-evidence
        run: |
          mkdir -p "$EVIDENCE_OUTPUT"
          bun scripts/qa/reception_checkpoint_evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reception-checkpoint-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/reception-checkpoint-evidence/
          if-no-files-found: error
          retention-days: 14
