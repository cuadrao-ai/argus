name: Private Alpha Canary

"on":
  workflow_dispatch:
    inputs:
      browser_artifact_probe:
        description: Deliberately fail the browser to prove artifact safety
        required: true
        default: none
        type: choice
        options:
          - none
          - redacted
          - unredacted
      canary_identity_action:
        description: One-time setup for a newly rotated dedicated canary identity
        required: true
        default: validate
        type: choice
        options:
          - validate
          - provision
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: private-alpha-canary
  cancel-in-progress: false

jobs:
  release-coherence:
    name: Release coherence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGUS_WARMUP_EXPECT_MODE: real-workflow
      ARGUS_CANARY_SURFACE: release-coherence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled runs use the deployed main tree. A dispatch keeps the
          # selected branch harness so a fix can be proved before promotion.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Render CLI
        run: |
          tmpdir="$(mktemp -d)"
          curl -fsSL https://github.com/render-oss/cli/releases/download/v2.20.0/cli_2.20.0_linux_amd64.zip -o "$tmpdir/render.zip"
          unzip -q "$tmpdir/render.zip" -d "$tmpdir"
          sudo mv "$tmpdir/cli_v2.20.0" /usr/local/bin/render
          render --version

      - name: Resolve deployed canary release
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: .github/canary-resolve-deployed.sh

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Check release-coherence secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CUADRAO_OPS_TOKEN: ${{ secrets.CUADRAO_OPS_TOKEN }}
          ARGUS_WORKFLOW_DATABASE_URL: ${{ secrets.ARGUS_WORKFLOW_DATABASE_URL }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in \
            RENDER_API_KEY \
            CUADRAO_OPS_TOKEN \
            ARGUS_WORKFLOW_DATABASE_URL \
            ARGUS_CANARY_SUPABASE_URL \
            ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release-coherence secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare release-coherence evidence directory
        run: |
          mkdir -p temp/canary-evidence
          umask 077
          : > temp/canary-evidence/release-coherence-capture.json
          rm -f temp/canary-evidence/release-coherence-capture.json

      - name: Run direct API signup-denial probe
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CUADRAO_OPS_TOKEN: ${{ secrets.CUADRAO_OPS_TOKEN }}
          ARGUS_WORKFLOW_DATABASE_URL: ${{ secrets.ARGUS_WORKFLOW_DATABASE_URL }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          ARGUS_CANARY_EVIDENCE_PATH=temp/canary-evidence/release-coherence.json \
          ARGUS_CANARY_CAPTURE_PATH=temp/canary-evidence/release-coherence-capture.json \
          .github/canary-render.sh
          status=$?
          echo "$status" > temp/canary-evidence/release-coherence.exit
          exit "$status"

      - name: Require release coherence
        if: always()
        run: |
          status_file="temp/canary-evidence/release-coherence.exit"
          if [ ! -f "$status_file" ]; then
            echo "release_coherence_exit=missing"
            exit 1
          fi
          status="$(cat "$status_file")"
          echo "release_coherence_exit=$status"
          [ "$status" = "0" ]

      - name: Upload release-coherence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-release-coherence-evidence
          path: |
            temp/canary-evidence/release-coherence.json
            temp/canary-evidence/release-coherence.exit
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed release-coherence capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-release-coherence-failure-capture
          path: temp/canary-evidence/release-coherence-capture.json
          if-no-files-found: warn
          retention-days: 30

  authenticated-browser-journey:
    name: Authenticated browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ARGUS_WARMUP_EXPECT_MODE: real-workflow
      ARGUS_CANARY_SURFACE: authenticated-browser-journey
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Render CLI
        run: |
          tmpdir="$(mktemp -d)"
          curl -fsSL https://github.com/render-oss/cli/releases/download/v2.20.0/cli_2.20.0_linux_amd64.zip -o "$tmpdir/render.zip"
          unzip -q "$tmpdir/render.zip" -d "$tmpdir"
          sudo mv "$tmpdir/cli_v2.20.0" /usr/local/bin/render
          render --version

      - name: Resolve deployed canary release
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: .github/canary-resolve-deployed.sh

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Install Chromium for the authenticated browser canary
        run: cd web && bunx playwright install --with-deps chromium

      - name: Check authenticated-browser secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ARGUS_CANARY_EMAIL: ${{ secrets.ARGUS_CANARY_EMAIL }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in \
            RENDER_API_KEY \
            ARGUS_CANARY_EMAIL \
            ARGUS_CANARY_SUPABASE_URL \
            ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required authenticated-browser secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Provision dedicated canary identity
        if: github.event_name == 'workflow_dispatch' && inputs.canary_identity_action == 'provision'
        env:
          ARGUS_CANARY_EMAIL: ${{ secrets.ARGUS_CANARY_EMAIL }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source .github/argus-env.sh
          cd web
          ARGUS_CANARY_API_URL="$ARGUS_PRIVATE_LAUNCH_API_URL" \
            bun e2e/support/private-alpha-canary-session.ts provision

      - name: Prepare authenticated-browser evidence directory
        run: |
          mkdir -p temp/canary-evidence
          umask 077
          : > temp/canary-evidence/authenticated-browser-capture.json
          rm -f temp/canary-evidence/authenticated-browser-capture.json

      - name: Run authenticated browser checks
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ARGUS_CANARY_EMAIL: ${{ secrets.ARGUS_CANARY_EMAIL }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
          ARGUS_CANARY_BROWSER_ARTIFACT_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_artifact_probe || 'none' }}
          ARGUS_CANARY_BROWSER_REDACTION_PROBE_VALUE: canary-redaction-probe-value
          ARGUS_CANARY_REDACT_SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_artifact_probe == 'unredacted' && 'true' || 'false' }}
        run: |
          set +e
          ARGUS_CANARY_EVIDENCE_PATH=temp/canary-evidence/authenticated-browser.json \
          ARGUS_CANARY_CAPTURE_PATH=temp/canary-evidence/authenticated-browser-capture.json \
          .github/canary-render.sh
          status=$?
          echo "$status" > temp/canary-evidence/authenticated-browser.exit
          exit "$status"

      - name: Require authenticated browser journey
        if: always()
        run: |
          status_file="temp/canary-evidence/authenticated-browser.exit"
          if [ ! -f "$status_file" ]; then
            echo "authenticated_browser_exit=missing"
            exit 1
          fi
          status="$(cat "$status_file")"
          echo "authenticated_browser_exit=$status"
          [ "$status" = "0" ]

      - name: Upload authenticated-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-authenticated-browser-evidence
          path: |
            temp/canary-evidence/authenticated-browser.json
            temp/canary-evidence/authenticated-browser.exit
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed authenticated-browser capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-authenticated-browser-failure-capture
          path: temp/canary-evidence/authenticated-browser-capture.json
          if-no-files-found: warn
          retention-days: 30

      # canary-render.sh masks credential values and creates this sentinel.
      # Without it, failure context is skipped instead of uploaded.
      - name: Check browser canary context redaction
        id: browser_context
        if: always()
        run: |
          if [ -f web/temp/playwright-results/.redacted ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "browser_context_upload=skipped_unredacted"
          fi

      - name: Upload browser canary failure context
        if: failure() && steps.browser_context.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-authenticated-browser-context
          path: web/temp/playwright-results/**
          if-no-files-found: ignore
          retention-days: 30
