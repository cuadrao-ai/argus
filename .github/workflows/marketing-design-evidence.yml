name: Marketing design evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    paths:
      - marketing/**
      - .github/workflows/marketing-design-evidence.yml

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      MARKETING_E2E_MOCK_PORT: "4494"
      MARKETING_E2E_SITE_PORT: "4495"
      MARKETING_E2E_PUBLIC_PORT: "4496"
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install frozen Marketing dependencies
        working-directory: marketing
        run: bun install --frozen-lockfile
      - name: Build Marketing site
        working-directory: marketing
        run: bun run build
      - name: Install headless browser
        working-directory: marketing
        run: bunx playwright install --with-deps chromium
      - name: Capture and verify synthetic design evidence
        working-directory: marketing
        run: bunx playwright test e2e/design-evidence.spec.ts
      - name: Upload exact-head design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-design-${{ github.event.pull_request.head.sha || github.sha }}
          path: marketing/test-results/**/design-evidence-*-mock.png
          if-no-files-found: error
          retention-days: 14
