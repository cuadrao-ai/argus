name: CI

"on":
  # Push runs only for the long-lived branches. A feature branch with a PR runs
  # CI once per push, from the pull_request event below.
  push:
    branches: [main, "codex/private-alpha-next", "codex/private-alpha-next-jules-intake"]
  pull_request:
    branches: [main, "codex/private-alpha-next", "codex/private-alpha-next-jules-intake"]
    types: [opened, synchronize, reopened, ready_for_review]
  # Only the real-Postgres matrix on the latest Supabase CLI runs on these, so
  # a new Supabase image that breaks a migration shows up before a PR does.
  # A manual run with full_run checked runs every job instead, on both CLIs.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      full_run:
        description: Run every job, as an integration push does
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARGUS_CI_BUN_VERSION: "1.3.14"
  ARGUS_CI_SUPABASE_CLI_VERSION: "2.109.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/private-alpha-next' && github.ref != 'refs/heads/codex/private-alpha-next-jules-intake' }}

jobs:
  docs-change-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      run_marketing: ${{ steps.classify.outputs.run_marketing }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_backend: ${{ steps.classify.outputs.run_backend }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}
      run_database: ${{ steps.classify.outputs.run_database }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select jobs from changed files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/docs-only-changes.sh

  ownership-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Reject credential literals in tracked configuration
        run: python scripts/check_config_credentials.py

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${PR_BASE_SHA}^{commit}"; then
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          git cat-file -e "${PR_BASE_SHA}^{commit}"

      - name: Reject new evidence media
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/check_no_evidence_media.py

      - name: Reject new or changed files over 2 MB
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/check_file_size.py

      - name: Run branch ownership gate
        run: python .agent/scripts/ownership/verify_branch_ownership.py

  docs-checks:
    runs-on: ubuntu-latest
    needs: docs-change-gate
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) && needs.docs-change-gate.outputs.docs_only == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check conflict markers and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${PR_BASE_SHA}...HEAD"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Publish message and stream shapes
        run: |
          python scripts/publish_message_stream_shapes.py
          git diff --exit-code -- docs/message-and-stream-shapes.md

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev --no-interaction

      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Helper folders can include backend tests of the shared TypeScript contract.
      - name: Set up Bun for cross-runtime contract tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.ARGUS_CI_BUN_VERSION }}

      - name: Install frontend dependencies for cross-runtime contract tests
        run: cd web && bun install --frozen-lockfile

      - name: Check changed documentation links
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: poetry run python scripts/check_docs_links.py --base "$PR_BASE_SHA"

      - name: Run docs-reading backend tests
        run: |
          selection="$(.github/docs-reading-tests.sh)"
          docs_tests=()
          while IFS= read -r path; do
            [ -z "$path" ] || docs_tests+=("$path")
          done <<< "$selection"
          if [ "${#docs_tests[@]}" -eq 0 ]; then
            echo "docs-reading test selector returned no files."
            exit 1
          fi
          printf 'Selected %s docs-reading test file(s):\n' "${#docs_tests[@]}"
          printf '  %s\n' "${docs_tests[@]}"
          poetry run pytest "${docs_tests[@]}" -q --no-cov

  backend-shards:
    runs-on: ubuntu-latest
    needs: docs-change-gate
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run)) && needs.docs-change-gate.outputs.run_backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      CI_SHARD_INDEX: ${{ matrix.shard }}
      CI_SHARD_COUNT: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Set up Bun for cross-runtime contract tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.ARGUS_CI_BUN_VERSION }}

      - name: Install frontend dependencies for cross-runtime contract tests
        run: cd web && bun install --frozen-lockfile

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Lint backend, tests, scripts, and workflows
        if: matrix.shard == 0
        run: poetry run ruff check src tests workflows scripts

      - name: Publish message and stream shapes
        if: matrix.shard == 0
        run: |
          python scripts/publish_message_stream_shapes.py
          git diff --exit-code -- docs/message-and-stream-shapes.md

      - name: Check modularity budget
        if: matrix.shard == 0
        run: poetry run python scripts/check_modularity_budget.py

      # Directory-level so new test files are gated without editing this workflow.
      - name: Run backend regression suite
        run: >-
          poetry run pytest tests -q --no-cov
          -p scripts.ci.pytest_inventory
          --ci-inventory=temp/ci-inventory/backend-${CI_SHARD_INDEX}.json
          --ci-shard-index "${CI_SHARD_INDEX}" --ci-shard-count "${CI_SHARD_COUNT}"
          --ci-timings=scripts/ci/timings/backend.generated.json

      - name: Retain backend test inventory and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-inventory-backend-${{ github.run_id }}-${{ matrix.shard }}
          path: temp/ci-inventory/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  backend-checks:
    runs-on: ubuntu-latest
    needs: [docs-change-gate, backend-shards]
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run))
    steps:
      - name: Path filter passes backend-checks
        if: needs.docs-change-gate.outputs.run_backend != 'true'
        run: echo "backend-checks not selected"

      - name: Require every backend shard
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        env:
          SHARDS_RESULT: ${{ needs.backend-shards.result }}
        run: test "$SHARDS_RESULT" = success

      - name: Checkout
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Download backend inventories
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-inventory-backend-${{ github.run_id }}-*
          path: temp/ci-inventory
          merge-multiple: true

      - name: Prove backend test union
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        run: >-
          python scripts/ci/test_shards.py temp/ci-inventory/backend-*.json
          --output temp/ci-proof/backend.json

      - name: Retain backend union proof
        if: needs.docs-change-gate.outputs.run_backend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-proof-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/ci-proof/backend.json
          if-no-files-found: error
          retention-days: 14

  frontend-checks:
    runs-on: ubuntu-24.04
    needs: docs-change-gate
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run))
    steps:
      - name: Path filter passes frontend-checks
        if: needs.docs-change-gate.outputs.run_frontend != 'true'
        run: echo "frontend-checks not selected"

      - name: Checkout
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.ARGUS_CI_BUN_VERSION }}

      - name: Install frontend dependencies
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: cd web && bun install --frozen-lockfile

      # next build does not lint, so without this the ESLint ban that keeps
      # browser state behind lib/browser-storage.ts is not a gate at all.
      - name: Lint frontend
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: cd web && bun run lint

      - name: Run frontend tests
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: cd web && bun test

      - name: Build frontend
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: cd web && bun run build

      # Observation backstop for the browser-storage disclosure. The chokepoint
      # and the ESLint ban stop accidents; this catches a deliberate bypass by
      # watching what a real browser actually keeps. One spec, not the suite.
      - name: Install Playwright chromium
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: cd web && bunx playwright install --with-deps chromium

      - name: Verify browser storage matches the privacy disclosure
        if: needs.docs-change-gate.outputs.run_frontend == 'true'
        run: |
          cd web
          bunx playwright test e2e/browser-storage-disclosure.spec.ts
          NEXT_PUBLIC_BUSINESS_PILOT_ENABLED=true PLAYWRIGHT_PORT=3101 bunx playwright test e2e/business-receipt-upload-recovery.spec.ts
          NEXT_PUBLIC_BUSINESS_PILOT_ENABLED=true NEXT_PUBLIC_ENABLE_SPANISH=true PLAYWRIGHT_PORT=3102 bunx playwright test --config e2e/business-consent.playwright.config.ts

      - name: Retain receipt upload browser evidence
        if: always() && needs.docs-change-gate.outputs.run_frontend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipt-upload-browser-evidence
          path: |
            web/temp/playwright-results/**/receipt-upload-*.png
            web/temp/consent-results/**/channels-*.png
          if-no-files-found: warn

  marketing-checks:
    runs-on: ubuntu-24.04
    needs: docs-change-gate
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run))
    steps:
      - name: Path filter passes marketing-checks
        if: needs.docs-change-gate.outputs.run_marketing != 'true'
        run: echo "marketing-checks not selected"

      - name: Checkout
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.ARGUS_CI_BUN_VERSION }}

      # The marketing website is an independent package with its own lockfile.
      # The runbook pins the same Node on Render, so CI proves the runtime that ships.
      - name: Set up Node
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"

      - name: Install marketing dependencies
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun install --frozen-lockfile

      - name: Lint marketing
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun run lint

      - name: Typecheck marketing
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun run typecheck

      - name: Run marketing tests
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun test

      - name: Build marketing
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun run build

      - name: Install Playwright chromium
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bunx playwright install --with-deps chromium

      # Real browser journeys against the production build, with Resend and
      # Supabase replaced by a local recorder so receipt and storage are asserted.
      - name: Run marketing browser journeys
        if: needs.docs-change-gate.outputs.run_marketing == 'true'
        run: cd marketing && bun run test:e2e

      - name: Upload marketing browser report
        if: always() && needs.docs-change-gate.outputs.run_marketing == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-playwright-report-${{ github.sha }}
          path: |
            marketing/playwright-report
            marketing/test-results
          retention-days: 14

  # Runs the guest gates and the real-Postgres proofs against a local Supabase
  # whose start applies every migration and the seed once. A pull request runs
  # the pilot set of tests/test_*_postgres.py on the pinned CLI; a push, the
  # schedule and a manual run run every tests/test_*_postgres.py, so a new proof
  # is gated after merge. The start skips the Supabase containers no test here
  # reads. Formerly named guest-release-gates; no branch setting requires
  # either name.
  database-shards:
    runs-on: ubuntu-latest
    needs: docs-change-gate
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.docs-change-gate.outputs.run_database == 'true'
    # "pinned" is the CLI every gate runs on, and the only leg a pull request
    # runs. "latest" runs only the real-Postgres matrix, on the weekly schedule
    # and on pushes, so a newer image's default grants cannot pass unseen.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        supabase-cli: ${{ fromJSON(github.event_name == 'pull_request' && '["pinned"]' || ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.full_run)) && '["latest"]' || '["pinned", "latest"]')) }}
    env:
      CI_SHARD_INDEX: ${{ matrix.shard }}
      CI_SHARD_COUNT: "3"
      OPENROUTER_API_KEY: ""
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      ARGUS_MARKET_DATA_PROVIDER_MODE: synthetic_unit_fixture
      CUADRAO_MOCK_AUTH: "false"
      NEXT_PUBLIC_MOCK_AUTH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: ${{ matrix.supabase-cli == 'latest' && 'latest' || env.ARGUS_CI_SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      # Auth, REST and Storage are what the tests call. Excluded: Studio and
      # postgres-meta (dashboard), Realtime, imgproxy (image transforms),
      # Edge Runtime (no test serves a function) and Mailpit (sign-up here
      # needs no email confirmation, and no job exports a Mailpit URL).
      - name: Start disposable local Supabase
        run: |
          supabase start -x studio,postgres-meta,realtime,imgproxy,edge-runtime,mailpit
          eval "$(supabase status -o env)"
          {
            echo "ARGUS_DISPOSABLE_DATABASE_URL=$DB_URL"
            echo "ARGUS_LOCAL_SUPABASE_URL=$API_URL"
            echo "ARGUS_LOCAL_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "ARGUS_LOCAL_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Print Supabase CLI and image versions
        run: |
          supabase --version
          docker ps --filter "name=supabase_" --format '{{.Names}} {{.Image}}' | sort

      # Every event except a pull request runs the full tests/test_*_postgres.py
      # glob, so a new _postgres proof is gated without editing this workflow.
      # A pull request runs the hand-kept pilot set below, so a proof with a
      # name outside it is first gated on the push after merge. A pattern that
      # matches no file fails the step.
      - name: Run required real-PostgreSQL matrix
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            patterns=(
              'tests/test_business*_postgres.py'
              'tests/test_whatsapp*_postgres.py'
              'tests/test_ingestion*_postgres.py'
              'tests/test_fiscal*_postgres.py'
              'tests/test_registros*_postgres.py'
              'tests/test_document*_postgres.py'
              'tests/test_rls*_postgres.py'
              'tests/test_access*_postgres.py'
              'tests/test_client_grants_postgres.py'
              'tests/test_account_deletion_fk_census_postgres.py'
              'tests/test_email_daily_budget_postgres.py'
              'tests/test_dgii_rnc_postgres.py'
              'tests/test_supplier_fast_path_postgres.py'
              'tests/test_flags_off_removal_postgres.py'
              'tests/test_login_failure_parity_postgres.py'
            )
          else
            patterns=('tests/test_*_postgres.py')
          fi
          files=()
          for pattern in "${patterns[@]}"; do
            matched=($pattern)
            if [ "${#matched[@]}" -eq 0 ] || [ ! -e "${matched[0]}" ]; then
              echo "No test file matches $pattern" >&2
              exit 1
            fi
            files+=("${matched[@]}")
          done
          echo "Running ${#files[@]} real-PostgreSQL test files for $GITHUB_EVENT_NAME"
          poetry run pytest \
            "${files[@]}" \
            --junitxml=temp/guest-postgres-junit.xml \
            -p scripts.ci.pytest_inventory \
            --ci-inventory=temp/ci-inventory/postgres-${CI_SHARD_INDEX}.json \
            --ci-shard-index "${CI_SHARD_INDEX}" --ci-shard-count "${CI_SHARD_COUNT}" \
            --ci-timings=scripts/ci/timings/postgres.generated.json \
            -q --no-cov
          poetry run python scripts/qa/assert_pytest_gate.py \
            temp/guest-postgres-junit.xml

      - name: Run required local anonymous Auth matrix
        if: matrix.supabase-cli == 'pinned' && matrix.shard == 0
        run: |
          poetry run pytest \
            tests/test_guest_auth_local_supabase.py \
            --junitxml=temp/guest-auth-junit.xml \
            -p scripts.ci.pytest_inventory \
            --ci-inventory=temp/ci-inventory/auth.json \
            -q --no-cov
          poetry run python scripts/qa/assert_pytest_gate.py \
            temp/guest-auth-junit.xml

      - name: Retain database test inventory and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-inventory-database-${{ matrix.supabase-cli }}-${{ github.run_id }}-${{ matrix.shard }}
          path: temp/ci-inventory/*.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  database-checks:
    runs-on: ubuntu-latest
    needs: [docs-change-gate, database-shards]
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        supabase-cli: ${{ fromJSON(github.event_name == 'pull_request' && '["pinned"]' || ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.full_run)) && '["latest"]' || '["pinned", "latest"]')) }}
    steps:
      - name: Path filter passes database-checks
        if: needs.docs-change-gate.outputs.run_database != 'true'
        run: echo "database-checks not selected"

      - name: Require every database shard
        if: needs.docs-change-gate.outputs.run_database == 'true'
        env:
          SHARDS_RESULT: ${{ needs.database-shards.result }}
        run: test "$SHARDS_RESULT" = success

      - name: Checkout
        if: needs.docs-change-gate.outputs.run_database == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        if: needs.docs-change-gate.outputs.run_database == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Download database inventories
        if: needs.docs-change-gate.outputs.run_database == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-inventory-database-${{ matrix.supabase-cli }}-${{ github.run_id }}-*
          path: temp/ci-inventory
          merge-multiple: true

      - name: Prove database test union
        if: needs.docs-change-gate.outputs.run_database == 'true'
        run: >-
          python scripts/ci/test_shards.py temp/ci-inventory/postgres-*.json
          --require-passed --output temp/ci-proof/postgres.json

      - name: Prove anonymous Auth test union
        if: matrix.supabase-cli == 'pinned' && needs.docs-change-gate.outputs.run_database == 'true'
        run: >-
          python scripts/ci/test_shards.py temp/ci-inventory/auth.json
          --require-passed --output temp/ci-proof/auth.json

      - name: Retain database union proof
        if: needs.docs-change-gate.outputs.run_database == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-proof-database-${{ matrix.supabase-cli }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/ci-proof/*.json
          if-no-files-found: error
          retention-days: 14

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.full_run))
    needs:
      - docs-change-gate
      - ownership-gate
      - docs-checks
      - backend-checks
      - frontend-checks
      - marketing-checks
      - database-checks
    steps:
      - name: All checks passed
        env:
          DOCS_CHANGE_GATE: ${{ needs.docs-change-gate.result }}
          OWNERSHIP_GATE: ${{ needs.ownership-gate.result }}
          DOCS_ONLY: ${{ needs.docs-change-gate.outputs.docs_only }}
          RUN_HEAVY: ${{ needs.docs-change-gate.outputs.run_heavy }}
          RUN_MARKETING: ${{ needs.docs-change-gate.outputs.run_marketing }}
          RUN_BACKEND: ${{ needs.docs-change-gate.outputs.run_backend }}
          RUN_FRONTEND: ${{ needs.docs-change-gate.outputs.run_frontend }}
          RUN_DATABASE: ${{ needs.docs-change-gate.outputs.run_database }}
          DOCS_CHECKS: ${{ needs.docs-checks.result }}
          BACKEND_CHECKS: ${{ needs.backend-checks.result }}
          FRONTEND_CHECKS: ${{ needs.frontend-checks.result }}
          MARKETING_CHECKS: ${{ needs.marketing-checks.result }}
          DATABASE_CHECKS: ${{ needs.database-checks.result }}
        # A selected job must succeed. The four product checks skip-pass, so
        # they report success when the path filter does not select them.
        run: |
          require_success() {
            if [ "$2" != success ]; then
              echo "$1: $2"
              exit 1
            fi
          }
          require_selected() {
            if [ "$2" = true ]; then
              require_success "$1" "$3"
            elif [ "$3" != success ] && [ "$3" != skipped ]; then
              echo "$1: $3 (not selected)"
              exit 1
            fi
          }
          require_success docs-change-gate "$DOCS_CHANGE_GATE"
          require_success ownership-gate "$OWNERSHIP_GATE"
          for flag in DOCS_ONLY RUN_HEAVY RUN_MARKETING RUN_BACKEND RUN_FRONTEND RUN_DATABASE; do
            case "${!flag:-}" in
              true|false) ;;
              *) echo "Invalid $flag: expected true or false."; exit 1 ;;
            esac
          done
          if [ "$RUN_BACKEND" != "$RUN_DATABASE" ]; then
            echo "Inconsistent selection: RUN_BACKEND=$RUN_BACKEND RUN_DATABASE=$RUN_DATABASE."
            exit 1
          fi
          heavy="false"
          if [ "$RUN_BACKEND" = true ] || [ "$RUN_FRONTEND" = true ] || [ "$RUN_DATABASE" = true ]; then
            heavy="true"
          fi
          if [ "$RUN_HEAVY" != "$heavy" ]; then
            echo "Inconsistent selection: RUN_HEAVY=$RUN_HEAVY expected $heavy."
            exit 1
          fi
          if [ "$DOCS_ONLY" = true ] && { [ "$RUN_HEAVY" = true ] || [ "$RUN_MARKETING" = true ]; }; then
            echo "Inconsistent selection: DOCS_ONLY=$DOCS_ONLY RUN_HEAVY=$RUN_HEAVY RUN_MARKETING=$RUN_MARKETING."
            exit 1
          fi
          if [ "$DOCS_ONLY" = false ] && [ "$RUN_BACKEND" = false ] && [ "$RUN_FRONTEND" = false ] && [ "$RUN_DATABASE" = false ] && [ "$RUN_MARKETING" = false ]; then
            echo "Inconsistent selection: no job selected."
            exit 1
          fi
          require_selected docs-checks "$DOCS_ONLY" "$DOCS_CHECKS"
          require_success backend-checks "$BACKEND_CHECKS"
          require_success frontend-checks "$FRONTEND_CHECKS"
          require_success marketing-checks "$MARKETING_CHECKS"
          require_success database-checks "$DATABASE_CHECKS"
          echo "CI checks passed."
