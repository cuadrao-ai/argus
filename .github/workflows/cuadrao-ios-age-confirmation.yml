name: Cuadrao iOS age confirmation
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/cuadrao-ios-age-confirmation.yml'
  push:
    branches:
      - 'codex/private-alpha-next'
    paths:
      - 'ios/**'
      - '.github/workflows/cuadrao-ios-age-confirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-age-confirmation:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK availability
        run: |
          python3 ios/scripts/check-age-sdk.py
          python3 ios/DesignPreviewTests/run_age_build_settings.py
      - name: Test age policy, persistence, and legal scope
        run: |
          python3 ios/DesignPreviewTests/run_age_confirmation.py
          python3 ios/DesignPreviewTests/run_cuadrao_legal_urls.py
          python3 ios/DesignPreviewTests/run_native_provider_config.py
      - name: Test session boundary
        run: swift test --package-path ios/Packages/ArgusSession
      - name: Compile iOS 17 deployment target
        run: >-
          xcodebuild build -project ios/ArgusFoundation.xcodeproj
          -scheme ArgusFoundation -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/.build/DerivedData
          CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=17.0
      - name: Test age gate and legal UI with synthetic Apple responses
        run: |
          device=$(xcrun simctl create 'Cuadrao Age Gate CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17)
          trap 'xcrun simctl delete "$device"' EXIT
          SIMULATOR_ID="$device" ios/scripts/verify.sh test -collect-test-diagnostics never -only-testing:ArgusFoundationUITests/AgeConfirmationUITests \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testGuestProfileHidesTheLegalLinksUntilThePagesArePublished \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testGuestProfileShowsTheLegalLinksFromTheOwnerAndOpensThem \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testSignUpHidesTheLegalLinksUntilThePagesArePublished \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testSignUpShowsTheLegalLinksFromTheOwner \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testSignUpDocumentLinksOpenTheOwnerDestinations \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testSignUpHidesAcceptanceWhenOnlyOneDocumentExists \
            -only-testing:ArgusFoundationUITests/FinancialLoopUITests/testSignUpRemainsReachableAtLargeTextSizes \
            ARGUS_AUTH_ENABLED=true ARGUS_API_URL=http://127.0.0.1:59999 \
            ARGUS_SUPABASE_URL=http://127.0.0.1:59999 ARGUS_WEB_URL=http://127.0.0.1:59999 \
            ARGUS_CAPTCHA_URL=http://127.0.0.1:59999 ARGUS_SUPABASE_ANON_KEY=synthetic-anon-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-age-confirmation-results
          path: ios/.build/results
          if-no-files-found: ignore
