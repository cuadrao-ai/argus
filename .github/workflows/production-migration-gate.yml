name: Production migration gate

"on":
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open promotion PR number targeting main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-gate-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  gate-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install trusted test dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --only main,dev --no-root --no-interaction
      - name: Test gate and synthetic promotion outcomes
        env:
          ARGUS_PRODUCTION_DATABASE_URL: ""
          ARGUS_DISPOSABLE_DATABASE_URL: ""
          CUADRAO_OPENROUTER_API_KEY_DEV: ""
          CUADRAO_OPENROUTER_API_KEY_PROD: ""
        run: >-
          poetry run pytest
          scripts/ops/tests/test_production_migration_gate.py
          scripts/ops/tests/test_production_migration_workflow.py -q --no-cov

  production-migration-gate:
    if: github.ref == 'refs/heads/main'
    needs: gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-migration-ledger
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install trusted ledger dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --only main --no-root --no-interaction
      - name: Verify candidate objects and publish exact head status
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          GH_TOKEN: ${{ github.token }}
          ARGUS_PRODUCTION_DATABASE_URL: ${{ secrets.CUADRAO_PRODUCTION_LEDGER_READ_URL }}
          CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT: ${{ vars.CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT }}
        run: poetry run python -m scripts.ops.production_migration_workflow
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-migration-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-migration-gate.json
          if-no-files-found: warn
          retention-days: 14
