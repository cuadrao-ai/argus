name: Production migration gate

"on":
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open promotion PR number targeting main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-gate-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  gate-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install trusted test dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --only dev --no-root --no-interaction
      - name: Test gate and synthetic promotion outcomes
        env:
          ARGUS_PRODUCTION_DATABASE_URL: ""
          ARGUS_DISPOSABLE_DATABASE_URL: ""
          CUADRAO_OPENROUTER_API_KEY_DEV: ""
          CUADRAO_OPENROUTER_API_KEY_PROD: ""
        run: poetry run pytest scripts/ops/tests/test_production_migration_gate.py -q --no-cov

  production-migration-gate:
    if: github.ref == 'refs/heads/main'
    needs: gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-migration-ledger
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install trusted ledger dependencies
        run: |
          python -m pip install poetry==2.1.3
          poetry install --only workflows --no-root --no-interaction
      - name: Verify candidate objects and publish exact head status
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          GH_TOKEN: ${{ github.token }}
          ARGUS_PRODUCTION_DATABASE_URL: ${{ secrets.CUADRAO_PRODUCTION_LEDGER_READ_URL }}
          CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT: ${{ vars.CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const env = process.env;
          const output = path.join(env.RUNNER_TEMP, 'production-migration-gate.json');
          const certificate = path.join(env.RUNNER_TEMP, 'production-ledger-ca.crt');
          const repository = env.GITHUB_REPOSITORY;
          const number = Number(env.PR_NUMBER);
          const trusted = env.GITHUB_SHA;
          const exactSha = /^[0-9a-f]{40}$/;
          let sha;
          let report = {};
          async function request(route, body) {
            const response = await fetch(`${env.GITHUB_API_URL}/repos/${repository}/${route}`, {
              method: body ? 'POST' : 'GET',
              headers: {Authorization: `Bearer ${env.GH_TOKEN}`, 'Content-Type': 'application/json'},
              ...(body ? {body: JSON.stringify(body)} : {}),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error('metadata or publication failed');
            return response.json();
          }
          async function currentHead() {
            const pr = await request(`pulls/${number}`);
            if (pr.number !== number || pr.state !== 'open' || pr.base?.ref !== 'main' ||
                pr.base?.repo?.full_name !== repository || !exactSha.test(pr.head?.sha || '')) {
              throw new Error('invalid promotion');
            }
            return pr.head.sha;
          }
          async function publish(state) {
            await request(`statuses/${sha}`, {
              state, context: 'production-migration-gate',
              description: 'Production migration verification: ' + state,
              target_url: `${env.GITHUB_SERVER_URL}/${repository}/actions/runs/${env.GITHUB_RUN_ID}`,
            });
          }
          function run(command, args, childEnv) {
            return spawnSync(command, args, {
              encoding: 'utf8', timeout: 120000, maxBuffer: 16 * 1024 * 1024,
              env: childEnv,
            });
          }
          function writeEvidence(state) {
            fs.writeFileSync(output, JSON.stringify({
              ...report, candidate_sha: sha, trusted_sha: trusted,
              status: state === 'error' ? 'blocked' : report.status,
              publication_status: state,
            }, null, 2) + '\n');
          }
          try {
            if (env.GITHUB_REF !== 'refs/heads/main' || !exactSha.test(trusted) ||
                !/^[1-9][0-9]*$/.test(env.PR_NUMBER || '') || !Number.isSafeInteger(number)) {
              throw new Error('invalid dispatch');
            }
            sha = await currentHead();
            await publish('pending');
            fs.rmSync(output, {force: true});
            if (!env.ARGUS_PRODUCTION_DATABASE_URL || !env.CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT) {
              throw new Error('ledger configuration missing');
            }
            fs.writeFileSync(certificate, env.CUADRAO_PRODUCTION_DATABASE_SSL_ROOT_CERT, {mode: 0o600});
            const {GH_TOKEN, ARGUS_PRODUCTION_DATABASE_URL, ...publicEnv} = env;
            const fetched = run('git', ['fetch', '--no-tags', 'origin', `refs/pull/${number}/head`], publicEnv);
            if (fetched.status !== 0) throw new Error('candidate fetch failed');
            const resolved = run('git', ['rev-parse', '--verify', 'FETCH_HEAD^{commit}'], publicEnv);
            if (resolved.status !== 0 || resolved.stdout.trim() !== sha) throw new Error('candidate changed');
            const result = run('poetry', [
              'run', 'python', 'scripts/ops/production_migration_gate.py',
              '--candidate-sha', sha, '--trusted-sha', trusted, '--output', output,
            ], {...publicEnv, ARGUS_PRODUCTION_DATABASE_URL,
                ARGUS_PRODUCTION_DATABASE_SSL_ROOT_CERT: certificate});
            report = JSON.parse(fs.readFileSync(output, 'utf8'));
            if (report.candidate_sha !== sha || report.trusted_sha !== trusted) {
              throw new Error('evidence identity mismatch');
            }
            let state;
            if (result.status === 0 && report.status === 'pass') state = 'success';
            else if (result.status === 1 && report.status === 'blocked') state = 'failure';
            else throw new Error('gate execution failed');
            if (await currentHead() !== sha) throw new Error('candidate changed');
            writeEvidence(state);
            await publish(state);
            if (state !== 'success') process.exitCode = 1;
          } catch {
            if (sha) {
              try { writeEvidence('error'); } catch { /* Keep the run failed. */ }
              try { await publish('error'); } catch { /* Keep the run failed. */ }
            }
            console.error('Promotion verification failed; no successful result was established.');
            process.exitCode = 1;
          } finally {
            fs.rmSync(certificate, {force: true});
          }
          NODE
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-migration-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-migration-gate.json
          if-no-files-found: warn
          retention-days: 14
