name: Desktop modal placement evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/private-alpha-next]
    paths:
      - web/scripts/desktop-modals-evidence.ts
      - .github/workflows/desktop-modals-evidence.yml

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_ENABLE_SPANISH: "true"
      NEXT_PUBLIC_BUSINESS_PILOT_ENABLED: "true"
      NEXT_PUBLIC_ARGUS_API_URL: http://127.0.0.1:3197/api/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3197
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install local browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Capture baseline and exact head
        env:
          BASE_SHA: 951af0e08087efb3defafae2c0df5bddfbd3ba24
        run: |
          set -euo pipefail
          evidence_root="$PWD/temp/desktop-modals-evidence"
          export EVIDENCE_OUTPUT="$evidence_root"
          mkdir -p "$evidence_root"
          git worktree add --detach ../desktop-modals-before "$BASE_SHA"
          cp web/scripts/desktop-modals-evidence.ts ../desktop-modals-before/web/scripts/
          ln -s "$PWD/web/node_modules" ../desktop-modals-before/web/node_modules
          capture() {
            local checkout="$1"
            export EVIDENCE_PHASE="$2"
            (
              cd "$checkout/web"
              bun scripts/desktop-modals-evidence.ts prepare
              bun node_modules/next/dist/bin/next dev --webpack --hostname 127.0.0.1 --port 3197 > "$evidence_root/$EVIDENCE_PHASE-server.log" 2>&1 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; bun scripts/desktop-modals-evidence.ts cleanup' EXIT
              for attempt in $(seq 1 60); do
                if curl --fail --silent http://127.0.0.1:3197/ > /dev/null; then break; fi
                sleep 1
              done
              curl --fail --silent http://127.0.0.1:3197/ > /dev/null
              bun scripts/desktop-modals-evidence.ts capture
            )
          }
          capture ../desktop-modals-before before
          capture . after
          cd web
          bun scripts/desktop-modals-evidence.ts compare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-modals-${{ github.event.pull_request.head.sha || github.sha }}
          path: temp/desktop-modals-evidence/
          if-no-files-found: error
          retention-days: 14
