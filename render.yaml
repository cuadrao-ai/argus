services:
  - type: web
    name: argus-api
    runtime: python
    repo: https://github.com/lagarcess/argus
    branch: main
    rootDir: .
    region: virginia
    plan: standard
    autoDeployTrigger: "off"
    buildCommand: poetry config virtualenvs.create false && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn argus.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    renderSubdomainPolicy: disabled
    envVars:
      - key: APP_ENV
        value: production
      - key: POETRY_VERSION
        value: "2.1.3"
      - key: ARGUS_PERSISTENCE_MODE
        value: supabase
      - key: ARGUS_DEV_MEMORY_FALLBACK
        value: "false"
      - key: ARGUS_MARKET_DATA_PROVIDER_MODE
        value: live_provider
      - key: MARKET_DATA_CACHE_TTL
        value: "43200"
      - key: ARGUS_RUNTIME_EVENT_TIMEOUT_SECONDS
        value: "180"
      - key: ARGUS_RUNTIME_EVENT_KEEPALIVE_SECONDS
        value: "15"
      - key: ARGUS_CHECKPOINTER_MODE
        value: postgres
      - key: ARGUS_MOCK_AUTH
        value: "false"
      - key: ARGUS_PUBLIC_ACCOUNT_ACCESS_ENABLED
        value: "true"
      - key: ARGUS_CORS_ALLOW_ORIGINS
        value: https://argus-app-suz5.onrender.com,https://arguschat.ai,https://www.arguschat.ai
      - key: ARGUS_APP_ORIGIN
        value: https://arguschat.ai
      - key: ARGUS_BACKTEST_JOBS_SHADOW_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_JOBS_DISPATCH_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_WORKFLOW_TASK
        value: argus-backtests/workflow_proof
      - key: ARGUS_BACKTEST_WORKFLOW_EXECUTION_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_REAL_WORKFLOW_TASK
        value: argus-backtests/run_backtest_job
      - key: ARGUS_BACKTEST_JOBS_USER_RUNNING_LIMIT
        value: "1"
      - key: ARGUS_BACKTEST_JOBS_USER_QUEUED_LIMIT
        value: "2"
      - key: ARGUS_BACKTEST_JOBS_GLOBAL_RUNNING_LIMIT
        value: "5"
      - key: ARGUS_BACKTEST_JOBS_GLOBAL_QUEUED_LIMIT
        value: "10"
      - key: ARGUS_EVIDENCE_RECEIPT_SHARING_ENABLED
        value: "false"
      - key: ARGUS_FINANCIAL_ACCOUNTS_ENABLED
        value: "false"
      - key: ARGUS_CROSS_CURRENCY_TRANSFERS_ENABLED
        value: "false"
      - key: ARGUS_HOUSEHOLDS_ENABLED
        value: "false"
