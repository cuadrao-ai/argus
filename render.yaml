services:
  # Production cuadrao-api service: srv-d78tanmuk2gs73e17nn0.
  - type: web
    name: cuadrao-api
    runtime: python
    repo: https://github.com/lagarcess/argus
    branch: main
    rootDir: .
    region: virginia
    plan: standard
    autoDeployTrigger: "off"
    buildCommand: poetry config virtualenvs.create false && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn argus.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    renderSubdomainPolicy: disabled
    envVars:
      - key: APP_ENV
        value: production
      - key: CUADRAO_PERSISTENCE_MODE
        value: supabase
      - key: CUADRAO_RUNTIME_EVENT_TIMEOUT_SECONDS
        value: "180"
