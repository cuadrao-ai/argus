[tool.poetry]
name = "argus"
version = "0.1.0"
description = "Argus - Pattern Analysis & Backtesting Engine"
authors = ["Admin <admin@example.com>"]
# Active Argus package source lives under src/argus.
package-mode = true
packages = [
    {include = "argus", from = "src"},
    {include = "argus_display_contract", from = "web"},
]

[tool.poetry.dependencies]
python = "^3.10"
# Configuration Management
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.0"
# Alpaca Market Data
alpaca-py = "^0.38.0"
# Logging
loguru = "^0.7.3"
# Data Analysis
pandas = "^2.2.0"
pandas-ta-classic = {git = "https://github.com/xgboosted/pandas-ta-classic.git", rev = "6e4cb10"}
dateparser = "^1.4.0"
# High-Performance Computing
numba = {version = ">=0.60.0", python = ">=3.10"}
joblib = "^1.5.3"
vectorbt = "^0.28.5"
# API Server
fastapi = {version = "0.124.4", extras = ["standard"]}
# Python 3.14-ready line; defer Starlette 1.x TestClient transport changes.
starlette = ">=0.48.0,<1.0.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
python-multipart = "^0.0.20"
# Decode bounded receipt photos and strip metadata before provider submission.
pillow = "^12.3.0"
# CommonMark link destinations in public receipt privacy checks.
markdown-it-py = "4.0.0"
# Supabase Auth
supabase = "^2.10.0"
pyjwt = {version = "^2.9.0", extras = ["crypto"]}
psutil = "^7.2.2"
litellm = "^1.83.7"
langchain = "^1.2.15"
langchain-openrouter = "^0.2.1"
langgraph = ">=1.1.5,<1.2.0"
langgraph-checkpoint-postgres = "^3.0.5"
psycopg = {extras = ["binary", "pool"], version = "^3.3.4"}
babel = "^2.17.0"
mem0ai = "^2.0.17"
number-parser = "0.3.2"
xlsxwriter = ">=3.2.9,<4"
lxml = "6.1.3"
zxing-cpp = "2.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
segno = "1.6.6"
pytest-mock = ">=3.15.1,<4.0.0"
pytest-cov = ">=4.0.0"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
faker = "^30.0.0"
pre-commit = "<4.0"
ruff = "0.4.10"
icdiff = ">=2.0.7,<3.0.0"
mypy = "^1.10.0"
respx = "^0.23.1"
hypothesis = "^6.151.12"
pytest-benchmark = "^5.2.3"


[tool.poetry.group.workflows]
optional = true

[tool.poetry.group.workflows.dependencies]
render-sdk = ">=0.7.0,<0.8.0"
psycopg = {version = ">=3.3.4,<4.0.0", extras = ["binary"]}

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "argus.analysis.structural",
    "argus.analysis.patterns",
    "argus.analysis.indicators",
    "argus.analysis.harmonics",
]
ignore_errors = true

[tool.coverage.run]
data_file = "temp/coverage/.coverage"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html:temp/coverage/html --cov-report=xml:temp/coverage/coverage.xml"
filterwarnings = [
    "ignore::DeprecationWarning:postgrest.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater.:UserWarning:langchain_core.*",
]
markers = [
    "slow: marks tests as slow (performance benchmarks requiring large datasets)",
    "owner_acts: the shared Business actions fixture acts as the owner (approval is the owner's alone)",
]

[tool.ruff]
required-version = "0.4.10"
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by ruff-format
]

[tool.ruff.lint.isort]
# profile = "black" is implied by Ruff's defaults and other settings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
